services:
  - type: web
    name: khadsetu-mvp-persistent
    runtime: node
    rootDir: render-mvp
    region: singapore
    plan: starter
    buildCommand: npm install --no-audit --no-fund && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    disk:
      name: khadsetu-demo-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 24.22.1
      - key: KHADSETU_SESSION_SECRET
        generateValue: true
      - key: KHADSETU_DATA_FILE
        value: /var/data/khadsetu.json
      - key: NODE_ENV
        value: production
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
